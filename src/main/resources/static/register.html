<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>NORA | Create Account</title>

    <link
            rel="stylesheet"
            href="/css/style.css"
    >

</head>


<body class="landing-page">

<div class="landing-container">


    <!-- =========================================
         NORA LOGO
         ========================================= -->

    <div class="brand-logo">
        N
    </div>


    <!-- =========================================
         BRAND NAME
         ========================================= -->

    <h1>
        NORA
    </h1>


    <p>
        Personal Intelligence & Decision Support
    </p>


    <!-- =========================================
         REGISTER CARD
         ========================================= -->

    <div class="auth-card">

        <h2>
            Create Your Account
        </h2>

        <p class="auth-subtitle">
            Create your personal workspace with NORA.
        </p>


        <!-- =====================================
             REGISTER FORM
             ===================================== -->

        <form id="registerForm">


            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    Full Name *
                </label>

                <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email *
                </label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password *
                </label>

                <div class="password-wrapper">

                    <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                    >

                    <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                    >
                        Show
                    </button>

                </div>

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label for="phone">
                    Phone
                </label>

                <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        autocomplete="tel"
                >

            </div>


            <!-- DATE OF BIRTH -->

            <div class="form-group">

                <label for="dateOfBirth">
                    Date of Birth
                </label>

                <input
                        type="date"
                        id="dateOfBirth"
                        name="dateOfBirth"
                >

            </div>


            <!-- OCCUPATION -->

            <div class="form-group">

                <label for="occupation">
                    Occupation
                </label>

                <input
                        type="text"
                        id="occupation"
                        name="occupation"
                        placeholder="e.g. Student, Developer"
                >

            </div>


            <!-- CITY -->

            <div class="form-group">

                <label for="city">
                    City
                </label>

                <input
                        type="text"
                        id="city"
                        name="city"
                        placeholder="Enter your city"
                        autocomplete="address-level2"
                >

            </div>


            <!-- BIO -->

            <div class="form-group">

                <label for="bio">
                    About You
                </label>

                <textarea
                        id="bio"
                        name="bio"
                        maxlength="500"
                        placeholder="Tell us a little about yourself..."
                        rows="4"
                ></textarea>

            </div>


            <!-- ERROR MESSAGE -->

            <div
                    id="registerError"
                    class="error-message"
                    style="display:none;"
            ></div>


            <!-- REGISTER BUTTON -->

            <button
                    type="submit"
                    class="primary-button auth-button"
            >
                Create Account
            </button>


        </form>


        <!-- =====================================
             LOGIN LINK
             ===================================== -->

        <div class="auth-footer">

            <p>
                Already have an account?
                <a href="/login.html">
                    Sign In
                </a>
            </p>

        </div>

    </div>


    <!-- =========================================
         BACK TO HOME
         ========================================= -->

    <a
            href="/index.html"
            class="back-link"
    >
        ← Back to NORA
    </a>


</div>


<!-- =========================================
     AUTH JAVASCRIPT
     ========================================= -->

<script src="/js/auth.js"></script>


</body>

</html>
