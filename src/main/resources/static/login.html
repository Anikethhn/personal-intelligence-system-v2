<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>NORA | Sign In</title>

    <link
            rel="stylesheet"
            href="/css/style.css"
    >

</head>


<body class="landing-page">

<div class="landing-container">


    <!-- =========================================
         NORA LOGO
         ========================================= -->

    <div class="brand-logo">
        N
    </div>


    <!-- =========================================
         BRAND NAME
         ========================================= -->

    <h1>
        NORA
    </h1>


    <p>
        Personal Intelligence & Decision Support
    </p>


    <!-- =========================================
         LOGIN CARD
         ========================================= -->

    <div class="auth-card">

        <h2>
            Welcome Back
        </h2>

        <p class="auth-subtitle">
            Sign in to continue to your NORA workspace.
        </p>


        <!-- =====================================
             LOGIN FORM
             ===================================== -->

        <form id="loginForm">


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                    >

                    <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                    >
                        Show
                    </button>

                </div>

            </div>


            <!-- ERROR MESSAGE -->

            <div
                    id="loginError"
                    class="error-message"
                    style="display:none;"
            ></div>


            <!-- LOGIN BUTTON -->

            <button
                    type="submit"
                    class="primary-button auth-button"
            >
                Sign In
            </button>


        </form>


        <!-- =====================================
             REGISTER LINK
             ===================================== -->

        <div class="auth-footer">

            <p>
                Don't have an account?
                <a href="/register.html">
                    Create Account
                </a>
            </p>

        </div>

    </div>


    <!-- =========================================
         BACK TO HOME
         ========================================= -->

    <a
            href="/index.html"
            class="back-link"
    >
        ← Back to NORA
    </a>


</div>


<!-- =========================================
     AUTH JAVASCRIPT
     ========================================= -->

<script src="/js/auth.js"></script>


</body>

</html>
